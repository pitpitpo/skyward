name: Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Try gh repo sync first (native GitHub fork sync)
          if gh repo sync ${{ github.repository }} -b ${{ github.ref_name }}; then
            echo "Successfully synced using gh repo sync."
          else
            echo "Fallback to git remote sync..."
            git remote add upstream "https://github.com/pacman-Sy/skyward.git" || git remote set-url upstream "https://github.com/pacman-Sy/skyward.git"
            git fetch upstream ${{ github.ref_name }}
            git merge --no-edit upstream/${{ github.ref_name }} || git merge --strategy-option=theirs --no-edit upstream/${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
